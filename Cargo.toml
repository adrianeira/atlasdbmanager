[workspace]
resolver = "3"
members = ["src-tauri", "crates/atlas-core", "crates/atlas-pg", "crates/atlas-local"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "MIT"
authors = ["Atlas DB Manager contributors"]

[workspace.dependencies]
atlas-core = { path = "crates/atlas-core" }
atlas-pg = { path = "crates/atlas-pg" }
atlas-local = { path = "crates/atlas-local" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tokio-postgres = "0.7"
postgres-native-tls = "0.5"
native-tls = "0.2"
futures-util = "0.3"
log = "0.4"
