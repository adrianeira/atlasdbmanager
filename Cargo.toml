[workspace]
resolver = "3"
members = ["src-tauri", "crates/atlas-core", "crates/atlas-pg", "crates/atlas-local", "crates/atlas-export", "crates/atlas-import", "crates/atlas-docs", "crates/atlas-ssh", "crates/atlas-sqlite", "crates/atlas-mssql", "crates/atlas-mysql", "crates/atlas-firebird", "crates/atlas-oracle"]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.90"
license = "MIT"
authors = ["Atlas DB Manager contributors"]

[workspace.dependencies]
atlas-core = { path = "crates/atlas-core" }
atlas-pg = { path = "crates/atlas-pg" }
atlas-local = { path = "crates/atlas-local" }
atlas-export = { path = "crates/atlas-export" }
atlas-import = { path = "crates/atlas-import" }
atlas-docs = { path = "crates/atlas-docs" }
atlas-ssh = { path = "crates/atlas-ssh" }
atlas-sqlite = { path = "crates/atlas-sqlite" }
atlas-mssql = { path = "crates/atlas-mssql" }
atlas-mysql = { path = "crates/atlas-mysql" }
atlas-firebird = { path = "crates/atlas-firebird" }
atlas-oracle = { path = "crates/atlas-oracle" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "process", "io-util"] }
tokio-postgres = "0.7"
postgres-native-tls = "0.5"
native-tls = "0.2"
futures-util = "0.3"
log = "0.4"

# Cópia do cliente Firebird em Rust puro (MIT) com um ajuste: mantém o tipo e a escala originais das colunas (NUMERIC, DATE, TIME) em vez de convertê-las.
[patch.crates-io]
rsfbclient-rust = { path = "vendor/rsfbclient-rust" }
# Cópia do cliente Oracle em Rust puro (MIT/Apache-2.0) com dois ajustes no tratamento de erros (ver vendor/oracle-rs/ATLAS-CHANGES.md).
oracle-rs = { path = "vendor/oracle-rs" }
