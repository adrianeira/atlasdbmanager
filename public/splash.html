<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>Atlas DB Manager</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #e9f1fb; cursor: default; user-select: none; }
      img { display: block; width: 100%; height: 100%; object-fit: cover; }
      /* Barra e texto de progresso: posições em % da janela; ajuste se trocar a imagem. */
      .progress { position: absolute; left: 50%; top: 82%; width: 26%; transform: translateX(-50%); text-align: center; }
      .track { height: 6px; border-radius: 3px; background: rgba(60, 100, 160, 0.18); overflow: hidden; }
      .fill { height: 100%; width: 0; border-radius: 3px; background: linear-gradient(90deg, #3d8bff, #2f6fe0); transition: width 0.25s ease-out; position: relative; overflow: hidden; }
      .fill::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, transparent, rgba(255,255,255,0.55), transparent); animation: shine 1.2s linear infinite; }
      @keyframes shine { from { transform: translateX(-100%); } to { transform: translateX(100%); } }
      .status { margin-top: 10px; font: 13px "Segoe UI", system-ui, sans-serif; color: #4a6283; letter-spacing: 0.3px; }
    </style>
  </head>
  <body>
    <img src="/splash.jpg" alt="Atlas DB Manager" draggable="false" />
    <div class="progress">
      <div class="track"><div class="fill" id="fill"></div></div>
      <div class="status" id="status"></div>
    </div>
    <script src="/splash.js"></script>
  </body>
</html>
