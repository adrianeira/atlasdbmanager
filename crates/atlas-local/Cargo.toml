[package]
name = "atlas-local"
description = "Atlas DB Manager — armazenamento local (SQLite) e cofre de credenciais do sistema"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
atlas-core.workspace = true
serde.workspace = true
serde_json.workspace = true
log.workspace = true
rusqlite = { version = "0.37", features = ["bundled", "backup"] }
keyring = { version = "3", features = ["windows-native", "apple-native", "linux-native-sync-persistent"] }
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
